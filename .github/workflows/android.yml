name: Android CI / CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar y Probar APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecución al Gradle Wrapper
        run: chmod +x gradlew

      - name: Ejecutar Pruebas Unitarias
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Compilar APK de Desarrollo (Debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK compilado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-libreta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
