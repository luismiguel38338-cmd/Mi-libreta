name: Android CI / CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar y Probar APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar entorno de compilación
        run: |
          chmod +x gradlew
          touch .env
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Ejecutar Pruebas Unitarias
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache

      - name: Compilar APK de Desarrollo (Debug)
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Subir APK compilado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-libreta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
